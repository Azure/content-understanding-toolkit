name: Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: Package index to publish to
        required: true
        type: choice
        options:
          - testpypi
          - pypi
      package:
        description: Package to publish; publish core before cli
        required: true
        type: choice
        options:
          - core
          - cli
      version:
        description: Exact package version from pyproject.toml
        required: true
        type: string
      commit:
        description: Full 40-character main commit SHA to release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ inputs.target }}-release-${{ inputs.package }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: cu-cli

jobs:
  build:
    name: Validate and build ${{ inputs.package }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate release request
        env:
          RELEASE_TARGET: ${{ inputs.target }}
          RELEASE_PACKAGE: ${{ inputs.package }}
          RELEASE_VERSION: ${{ inputs.version }}
          EXPECTED_COMMIT: ${{ inputs.commit }}
        run: >-
          python scripts/validate_release.py
          --index "${RELEASE_TARGET}"
          --package "${RELEASE_PACKAGE}"
          --version "${RELEASE_VERSION}"
          --expected-commit "${EXPECTED_COMMIT}"
          --actual-commit "${GITHUB_SHA}"
          --repository "${GITHUB_REPOSITORY}"
          --ref "${GITHUB_REF}"
          ${{ inputs.package == 'cli' && '--verify-core-on-index' || '' }}
      - name: Test exact release commit
        run: bash scripts/ci.sh
      - name: Build selected distribution
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          python -m pip install "build==1.3.0" "twine==6.2.0"
          if [[ "${PACKAGE}" == "core" ]]; then
            package_directory="packages/core"
          else
            package_directory="packages/standalone"
          fi
          python -m build "${package_directory}"
          mkdir -p dist
          cp "${package_directory}"/dist/* dist/
          python -m twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ inputs.target }}-${{ inputs.package }}-${{ inputs.version }}
          path: cu-cli/dist/*
          if-no-files-found: error

  publish-testpypi:
    name: Publish ${{ inputs.package }} to TestPyPI
    if: inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-${{ inputs.target }}-${{ inputs.package }}-${{ inputs.version }}
          path: dist
      - name: Publish selected distribution
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          attestations: false

  publish-pypi:
    name: Publish ${{ inputs.package }} to PyPI
    if: inputs.target == 'pypi'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-${{ inputs.target }}-${{ inputs.package }}-${{ inputs.version }}
          path: dist
      - name: Publish selected distribution
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
